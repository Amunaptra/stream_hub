[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-hub-device"
version = "0.1.0"
description = "Device agent for centrally managed Odroid HLS players"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "uvicorn>=0.30,<1",
  "zeroconf>=0.148,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[project.scripts]
stream-agent = "stream_agent.main:run"

[tool.setuptools]
package-dir = {"" = "device/agent"}

[tool.setuptools.packages.find]
where = ["device/agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
