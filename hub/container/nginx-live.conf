server {
    listen 8788;
    server_tokens off;

    # Hub uygulaması kendi Basic/session/device-token kimlik doğrulamasını yapar.
    # Proxy yalnızca upstream erişimini sağlar; heartbeat ve yönetim yazmaları
    # staging read-only kuralı gibi engellenmez.
    location / {
        proxy_pass http://hub:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
