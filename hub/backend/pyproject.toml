[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-hub-backend"
version = "0.1.0"
description = "Central inventory and management API for Stream Hub devices"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.139.2",
  "pydantic==2.13.4",
  "uvicorn==0.51.0",
  "zeroconf==0.148.0",
]

[project.scripts]
stream-hub = "stream_hub_backend.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["stream_hub_backend*"]
